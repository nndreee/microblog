<!doctype html>
<html lang="en">
  <head>
    {% if title %}
    <title>{{ title }} - Microblog</title>
    {% else %}
    <title>Welcome to Microblog</title>
    {% endif %}
  </head>
  <body>
    <h1>Hello, {{ user.username }}</h1>
    <ul>
      {% for post in posts %}
      <li>{{post.author.username}} says : {{post.body}}</li>
      {% endfor %}
    </ul>
  </body>
</html>
